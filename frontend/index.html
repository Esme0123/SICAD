<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SICAD - Control de Asistencia</title>
  <meta name="description"
    content="Sistema de Control de Asistencia Docente - App Móvil de Empleados del Centro de Cómputo de la Universidad Católica Boliviana" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SICAD" />
  <link rel="apple-touch-icon" href="/sicad-icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="/sicad-icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    #root {
      height: 100%;
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ Service Worker registrado con éxito en el scope:', reg.scope))
          .catch(err => console.error('❌ Error registrando Service Worker:', err));
      });
    }
  </script>

</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
